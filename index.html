    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for cleaner mobile look */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      html, body {
        background-color: #F7F6F3;
        -webkit-tap-highlight-color: transparent;
      }

      /* Squircle Avatar Style - Standard App Icon Look */
      .rounded-squircle {
        border-radius: 32%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      /* Safe Area Utilities.
         --safe-top is the real safe-area inset (0 on Android/desktop
         browsers). Only the iOS native shell (html.native-shell, set by the
         inline script below) enforces the 47px Dynamic-Island floor. */
      :root { --safe-top: env(safe-area-inset-top, 0px); }
      html.native-shell { --safe-top: max(env(safe-area-inset-top, 47px), 47px); }
      .pt-safe-top {
        padding-top: var(--safe-top) !important;
      }
      .pb-safe-area {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pt-content-safe {
        padding-top: calc(var(--safe-top) + 60px) !important;
      }
      /* Sticky page header that clears Dynamic Island / notch */
      .app-sticky-header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding-top: var(--safe-top);
      }
      
      /* Scrollbar Hide Utility */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.3s ease-out forwards;
      }

      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s ease-out forwards;
      }

      @keyframes fadeInUp {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.4s ease-out forwards;
      }

      @keyframes scaleIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scaleIn 0.2s ease-out forwards;
      }

      @keyframes bounceSubtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .animate-bounce-subtle {
        animation: bounceSubtle 2s infinite;
      }
      
      @keyframes widthGrow {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>

    <script>
      // Capacitor injects its bridge before app scripts; flag the native
      // shell so CSS can apply the notch floor only there.
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          document.documentElement.classList.add('native-shell');
        }
      } catch (e) {}
    </script>
