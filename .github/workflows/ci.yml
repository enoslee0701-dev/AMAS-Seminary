name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check + build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (if test script exists)
        run: npm test --if-present

      - name: Build
        run: npm run build

  backend:
    name: Backend (type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  regression:
    # ── 为什么必须有这个 job ───────────────────────────────────────
    # 2026-09-07 出过一次真实事故：AUTH-M7 删掉 POST /api/auth/register 之后，
    # 五个 App 回归脚本全部启动即崩、199 项断言一条都没执行，而 CI 依旧全绿 ——
    # 因为那五套从来不在 `npm test` 里。「npm test green + 199 项回归从未运行」
    # 是本项目最危险的假绿，这个 job 就是为了让它不可能再无声发生。
    #
    # 只跑 local gate：external（真实 Supabase / SMTP / LiveKit / 真机）不进
    # 绿色判据 —— 本 runner 不持有那些前提，混进来只会制造另一种假信号。
    name: Release gate (verify:local-release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root + backend)
        run: |
          npm ci
          npm ci --prefix backend

      # rooms-render 与 phase5 要拉起真实 headless 浏览器；ubuntu-latest 自带
      # Chrome，显式指到它，避免脚本回落到"找不到浏览器"的静默跳过。
      - name: Resolve Chrome for browser regressions
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"

      # 聚合门禁：backend test:local + 双 typecheck + 前端单测 + build + 五套 App 回归。
      # fail-fast 由 && 串联保证；**不得**加 || true / continue-on-error，
      # 也不得吞掉 exit code —— 任何一套回归失败都必须让 CI 变红。
      - name: Verify local release gate
        run: npm run verify:local-release

  ui-flows:
    # -- 为什么单开一个 job，而不是塞进 verify:local-release ----------
    # 这八个脚本是本阶段陆续加的 UI / 流程门禁（触控目标、弹窗层级、
    # 核心用户流程、discover 同源副本、自建群的身份隔离）。它们各自要起
    # vite 或极小静态服务器 + headless Chrome，全套约 10-15 分钟。
    # 塞进 regression 那条 && 链会把发布门禁的时长翻倍，而且一旦某个 UI
    # 断言抖动就会连带挡住后端与构建的信号 —— 两件事该分开判。
    #
    # 所以：独立 job、独立信号、与 regression 并行，互不阻塞。
    # 这里**不得**加 continue-on-error / || true —— 那就又变成假绿了。
    #
    # 这些脚本全程只写浏览器 localStorage 里自己用到的键，用例间互相清理；
    # 不连后端、不创建真实身份、不碰 canonical SQLite 与 live 配置，
    # 因此可以安全地在公共 runner 上跑。
    name: UI flows (verify:ui-flows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 每个脚本都会自己找 Chrome，但公共 runner 上的路径与本机不同；
      # 显式指过去，避免脚本回落到「找不到浏览器」然后静默退出。
      - name: Resolve Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Verify UI flows
        run: npm run verify:ui-flows

  ios:
    name: iOS Simulator smoke build
    needs: frontend
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor CLI 8.x 要求 Node >= 22 —— Node 20 下 `npx cap sync ios`
      # 会直接 fatal 退出。此前该 job 一直因前置 job 失败而 skipped，
      # 所以这条不兼容从未暴露；前置修绿之后它第一次真正执行就崩了。
      # 其余 job 保持 Node 20：它们不碰 Capacitor，没必要跟着动。
      - name: Setup Node 22 (Capacitor CLI requires >= 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Xcode build (Simulator, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
